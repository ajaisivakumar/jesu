<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMFESTA 2K26 — Brochure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150507; --bg-2:#1f0a0d; --ink:#f5f5f7; --ink-dim:rgba(245,245,247,.68);
    --ink-faint:rgba(245,245,247,.42);
    --red:#E01429; --red-soft:rgba(224,20,41,.18); --red-line:rgba(224,20,41,.30);
    --gold:#FFFFFF;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:transparent;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    /* IMPORTANT: no overflow:hidden / touch-action:none on the document —
       that is what previously trapped the parent page's scroll. Only the
       named event-list panels below get their own scroll container. */
  }
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}

  .brochure{
    position:relative;
    display:flex; flex-direction:column;
    height:100%;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(224,20,41,.16) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    border-radius:inherit;
  }

  /* ---- Header ---- */
  .b-head{
    flex-shrink:0;
    display:flex; align-items:center; gap:16px;
    padding:22px clamp(20px,4vw,36px) 18px;
    border-bottom:1px solid var(--red-line);
  }
  .b-crest{
    width:44px;height:44px;flex-shrink:0;object-fit:contain;
    filter:drop-shadow(0 0 8px rgba(224,20,41,.45));
  }
  .b-head-text{min-width:0;}
  .b-eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    color:var(--red); text-transform:uppercase; margin-bottom:2px;
  }
  .b-title{
    font-family:var(--font-display); font-weight:800; letter-spacing:-.02em;
    font-size:clamp(22px,3.4vw,30px); line-height:1;
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  .b-title span{ color:var(--red); }
  .b-sub{
    margin-top:4px; font-size:12.5px; color:var(--ink-faint);
    font-family:var(--font-mono); letter-spacing:.01em;
  }

  /* ---- Tabs ---- */
  .b-tabs{
    flex-shrink:0;
    display:flex; gap:8px;
    padding:16px clamp(20px,4vw,36px) 0;
  }
  .b-tab{
    flex:1;
    padding:12px 14px;
    font-family:var(--font-display); font-weight:600; font-size:14.5px;
    text-align:center;
    color:var(--ink-dim);
    background:rgba(245,245,247,.04);
    border:1px solid rgba(245,245,247,.10);
    border-bottom:none;
    border-radius:12px 12px 0 0;
    transition:background .25s ease, color .25s ease, border-color .25s ease;
  }
  .b-tab[aria-selected="true"]{
    color:var(--ink);
    background:var(--red-soft);
    border-color:var(--red-line);
  }
  .b-tab .b-tab-count{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-left:6px;
  }
  .b-tab[aria-selected="true"] .b-tab-count{ color:rgba(255,140,150,.85); }

  /* ---- Scrollable event list (this is the ONLY internal scroller) ---- */
  .b-body{
    flex:1;
    min-height:0;
    padding:4px clamp(14px,3vw,30px) 20px;
    background:rgba(245,245,247,.03);
    border:1px solid rgba(245,245,247,.10);
    border-top:none;
    margin:0 clamp(20px,4vw,36px);
    border-radius:0 0 14px 14px;
    overflow:hidden;
  }
  .event-list{
    height:100%;
    overflow-y:auto;
    /* Contain rubber-band bounce to this list; once it truly runs out of
       content to scroll, the wheel event is left alone so the browser's
       normal scroll-chaining hands control back to the page. */
    overscroll-behavior-y:contain;
    padding:16px 6px 8px 2px;
    display:flex; flex-direction:column; gap:14px;
    scrollbar-width:thin;
    scrollbar-color:rgba(224,20,41,.45) transparent;
  }
  .event-list::-webkit-scrollbar{ width:6px; }
  .event-list::-webkit-scrollbar-thumb{ background:rgba(224,20,41,.45); border-radius:3px; }
  .event-list[hidden]{ display:none; }

  .b-event{
    position:relative;
    padding:18px 20px;
    background:rgba(31,10,13,.65);
    border:1px solid rgba(245,245,247,.08);
    border-radius:14px;
    transition:border-color .25s ease, background .25s ease, transform .25s ease;
  }
  .b-event:hover{
    border-color:var(--red-line);
    background:rgba(31,10,13,.9);
  }
  .b-event-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    margin-bottom:8px;
  }
  .b-event-name-btn{
    text-align:left;
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(16.5px,2.4vw,19px);
    line-height:1.25;
    color:var(--ink);
    letter-spacing:-.01em;
    transition:color .3s ease, text-shadow .3s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .b-event-name-btn:hover,
  .b-event-name-btn:focus-visible{
    color:var(--red);
    text-shadow:0 0 18px rgba(224,20,41,.55);
    animation:name-blink .8s ease 1;
  }
  @keyframes name-blink{
    0%   { opacity:1; }
    40%  { opacity:.55; }
    100% { opacity:1; }
  }
  .b-event-name-btn .hint-icon{
    font-size:12px; opacity:0; transform:translateX(-3px);
    transition:opacity .25s ease, transform .25s ease;
    color:var(--red);
  }
  .b-event-name-btn:hover .hint-icon,
  .b-event-name-btn:focus-visible .hint-icon{ opacity:1; transform:translateX(0); }

  .b-event-num{
    flex-shrink:0;
    font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
    padding-top:3px;
  }
  .b-event-desc{
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-dim);
    margin-bottom:14px;
    max-width:56ch;
  }
  .b-event-register{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 18px;
    background:var(--red);
    color:#fff;
    font-family:var(--font-display); font-weight:600; font-size:13px;
    border-radius:8px;
    transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .b-event-register:hover{
    background:#FF4D5E;
    transform:translateY(-1px);
    box-shadow:0 6px 22px rgba(224,20,41,.4);
  }
  .b-event-register svg{ flex-shrink:0; }

  /* ---- Footer strip ---- */
  .b-foot{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
    padding:14px clamp(20px,4vw,36px) 18px;
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
    letter-spacing:.03em;
  }
  .b-foot strong{ color:var(--ink-dim); }

  @media (max-width:560px){
    .b-head{ padding:18px 16px 14px; gap:12px; }
    .b-crest{ width:36px; height:36px; }
    .b-tabs{ padding:12px 12px 0; }
    .b-body{ margin:0 12px; }
    .b-foot{ padding:12px 16px 16px; font-size:10.5px; }
  }

  @media (prefers-reduced-motion:reduce){
    .b-event-name-btn:hover, .b-event-name-btn:focus-visible{ animation:none; }
    *{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="brochure">
  <header class="b-head">
    <img src="logo.png" alt="" class="b-crest" aria-hidden="true">
    <div class="b-head-text">
      <div class="b-eyebrow">UCEV · Dept. of Computer Science Engineering</div>
      <h1 class="b-title">COMFESTA <span>2K26</span></h1>
      <div class="b-sub">Sep 30, 2026 · ₹200 online / ₹250 spot · Total prize pool ₹25,000</div>
    </div>
  </header>

  <div class="b-tabs" role="tablist" aria-label="Brochure event categories">
    <button class="b-tab" id="tabTech" role="tab" aria-selected="true" aria-controls="techList">
      Technical Events <span class="b-tab-count">04</span>
    </button>
    <button class="b-tab" id="tabNontech" role="tab" aria-selected="false" aria-controls="nontechList" tabindex="-1">
      Non-Technical Events <span class="b-tab-count">04</span>
    </button>
  </div>

  <div class="b-body">
    <div class="event-list" id="techList" role="tabpanel" aria-labelledby="tabTech">
      <!-- injected -->
    </div>
    <div class="event-list" id="nontechList" role="tabpanel" aria-labelledby="tabNontech" hidden>
      <!-- injected -->
    </div>
  </div>

  <div class="b-foot">
    <span>Drag the scrollbar or your trackpad to browse each list</span>
    <strong>Tap a name for full rules</strong>
  </div>
</div>

<script>
(function(){
  'use strict';

  // Same ids/copy as the main site's eventDetails map in script.js, kept
  // short here per the brochure brief (name + one-line description + CTA).
  var REG_LINK = 'PASTE_GOOGLE_FORM_LINK_HERE';

  var techEvents = [
    { id:'paper',   n:'01', title:'Paper Presentation',    desc:'Present research and emerging tech ideas to an expert panel.' },
    { id:'auction', n:'02', title:'Auction Coding Contest', desc:'Bid credits to buy coding problems, then solve them on the clock.' },
    { id:'vibe',    n:'03', title:'AI Vibe Coding',         desc:'Build a working micro-product with AI coding assistants in 90 minutes.' },
    { id:'qr',      n:'04', title:'QR Decrypt Hunt',        desc:'Follow a trail of hidden QR codes across campus to the finish line.' }
  ];
  var nontechEvents = [
    { id:'image',    n:'05', title:'Image Finding',   desc:'Spot hidden objects and mismatches in rapid-fire image rounds.' },
    { id:'charades', n:'06', title:'Dumb Charades',    desc:'Act it out, no words allowed — a fast test of expression and teamwork.' },
    { id:'gaming',   n:'07', title:'Gaming Arena',     desc:'Squad up for a custom-room Free Fire knockout tournament.' },
    { id:'ads',      n:'08', title:'Ads On Spot',      desc:'Turn a surprise product into a punchy 60-second ad, on the spot.' }
  ];

  function arrowSvg(){
    return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">'
         + '<path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function renderList(container, items){
    container.innerHTML = items.map(function(ev){
      return (
        '<article class="b-event">' +
          '<div class="b-event-top">' +
            '<button class="b-event-name-btn" type="button" data-event="' + ev.id + '">' +
              ev.title + '<span class="hint-icon">' + arrowSvg() + '</span>' +
            '</button>' +
            '<span class="b-event-num">' + ev.n + '</span>' +
          '</div>' +
          '<p class="b-event-desc">' + ev.desc + '</p>' +
          '<a class="b-event-register" href="' + REG_LINK + '" target="_blank" rel="noopener">' +
            'Register' + arrowSvg() +
          '</a>' +
        '</article>'
      );
    }).join('');
  }

  var techList = document.getElementById('techList');
  var nontechList = document.getElementById('nontechList');
  renderList(techList, techEvents);
  renderList(nontechList, nontechEvents);

  // Clicking an event name asks the parent page to open the existing
  // detail modal — reuses the modal already built into the main site.
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.b-event-name-btn');
    if (!btn) return;
    window.parent.postMessage({ type:'brochure-event-click', eventId: btn.dataset.event }, '*');
  });

  // Tabs
  var tabTech = document.getElementById('tabTech');
  var tabNontech = document.getElementById('tabNontech');
  function selectTab(which){
    var techOn = which === 'tech';
    tabTech.setAttribute('aria-selected', String(techOn));
    tabNontech.setAttribute('aria-selected', String(!techOn));
    tabTech.tabIndex = techOn ? 0 : -1;
    tabNontech.tabIndex = techOn ? -1 : 0;
    techList.hidden = !techOn;
    nontechList.hidden = techOn;
  }
  tabTech.addEventListener('click', function(){ selectTab('tech'); });
  tabNontech.addEventListener('click', function(){ selectTab('nontech'); });
  [tabTech, tabNontech].forEach(function(tab){
    tab.addEventListener('keydown', function(e){
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
        selectTab(tab === tabTech ? 'nontech' : 'tech');
        (tab === tabTech ? tabNontech : tabTech).focus();
      }
    });
  });
})();
</script>

</body>
</html>
